[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-important-agent"
version = "0.1.0"
description = "Agentic WeChat group monitor that forwards important events"
requires-python = ">=3.10"
dependencies = ["wechatauto-replica>=1.1.9"]

[project.optional-dependencies]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[project.scripts]
wechat-important-agent = "wechat_agent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechat_agent = ["web_dist/*", "web_dist/assets/*"]
